<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-size:xx-large
        }
        input {
            font-size: xx-large;
        }
    </style>
</head>
<body>

        <form action="/register">
            <tr>

                <td><input type=text name="name"></td>

                <td>UserName</td>

            </tr>
            <tr>
                <td><input type=submit value="register"></td>
            </tr>
        </form>
    </table>
</body>
</html>
